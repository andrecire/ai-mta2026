name: Publish workshop slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - name: Prepare CSV downloads and chart data
        run: python slides/scripts/prepare_data.py
      - name: Render presentation
        working-directory: slides
        run: quarto render index.qmd
      - name: Package public site
        run: |
          mkdir -p _site/assets/data
          cp slides/index.html _site/index.html
          cp slides/assets/data/*.csv _site/assets/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
